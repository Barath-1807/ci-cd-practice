name: CI CD Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ci-cd-app

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Step 3: Build Spring Boot application
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            .

      # Step 6: Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # Step 7: Deploy to EC2 Server 1
      - name: Deploy to Server 1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "===== Setting up Docker on Server 1 ====="

            # Check whether Docker is installed
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed. Installing Docker..."

              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker.io
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y docker
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
              else
                echo "Unsupported operating system. Install Docker manually."
                exit 1
              fi
            else
              echo "Docker is already installed."
            fi

            # Start Docker and enable it at boot
            sudo systemctl enable --now docker

            # Add the SSH user to the Docker group
            sudo usermod -aG docker "$USER" || true

            # Verify Docker installation
            sudo docker --version
            sudo docker info

            echo "===== Pulling image on Server 1 ====="

            # Pull the latest image
            sudo docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove the existing container
            sudo docker stop spring-boot-app || true
            sudo docker rm spring-boot-app || true

            # Run the new container
            sudo docker run -d \
              --name spring-boot-app \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Remove unused images
            sudo docker image prune -f

            # Verify the running container
            sudo docker ps

      # Step 8: Deploy to EC2 Server 2
      - name: Deploy to Server 2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER2_HOST }}
          username: ${{ secrets.SERVER2_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            echo "===== Setting up Docker on Server 2 ====="

            # Check whether Docker is installed
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed. Installing Docker..."

              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker.io
              elif command -v dnf >/dev/null 2>&1; then
                sudo dnf install -y docker
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker
              else
                echo "Unsupported operating system. Install Docker manually."
                exit 1
              fi
            else
              echo "Docker is already installed."
            fi

            # Start Docker and enable it at boot
            sudo systemctl enable --now docker

            # Add the SSH user to the Docker group
            sudo usermod -aG docker "$USER" || true

            # Verify Docker installation
            sudo docker --version
            sudo docker info

            echo "===== Pulling image on Server 2 ====="

            # Pull the latest image
            sudo docker pull \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove the existing container
            sudo docker stop spring-boot-app || true
            sudo docker rm spring-boot-app || true

            # Run the new container
            sudo docker run -d \
              --name spring-boot-app \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Remove unused images
            sudo docker image prune -f

            # Verify the running container
            sudo docker ps